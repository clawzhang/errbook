name: Build Docker Image

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 linux/amd64 镜像
        run: |
          docker build --platform linux/amd64 -t errbook:latest .

      - name: 导出镜像包
        run: |
          docker save errbook:latest | gzip > errbook-image.tar.gz
          ls -lh errbook-image.tar.gz

      - name: 上传镜像包
        uses: actions/upload-artifact@v4
        with:
          name: errbook-image-linux-amd64
          path: errbook-image.tar.gz
          retention-days: 7
