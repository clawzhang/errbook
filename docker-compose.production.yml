version: '3.8'

services:
  errbook:
    build:
      context: .
      dockerfile: Dockerfile.pnpm
    image: errbook:production
    container_name: errbook-prod
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - UPLOAD_DIR=/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
